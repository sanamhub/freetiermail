name: ci

on:
  pull_request:
  push:
    branches: [main]
  # CodeQL ships new queries between our releases. Without a schedule a quiet repository never
  # runs them.
  schedule:
    - cron: '0 3 * * 1'

# Least privilege by default; jobs opt into more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  CI: 'true'

jobs:
  build:
    # Job names are the required status checks in the branch ruleset. Renaming one silently
    # removes the gate, so change the ruleset in the same PR.
    name: build (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Otherwise the token stays in .git/config for every later step.
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: restore
        run: dotnet restore

      # TreatWarningsAsErrors plus AnalysisLevel latest-all makes this the lint gate too.
      - name: build
        run: dotnet build -c Release --no-restore

      - name: test
        run: >
          dotnet test -c Release --no-build
          --coverage --coverage-output-format cobertura
          --report-trx --report-trx-filename test-results.trx
          --results-directory TestResults

      - name: upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          retention-days: 7

  packaging:
    # Consumes the packed packages from a clean project, then again under Native AOT. The library
    # sets IsAotCompatible, and this is the only place that claim is tested end to end.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # tests/packaging/NuGet.Config reads the packages from this folder.
      - name: pack
        run: dotnet pack -c Release -o artifacts/packages

      - name: consume the packages
        run: ./tests/packaging/verify-package.sh --package-dir artifacts/packages

      - name: consume them under Native AOT
        run: |
          sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
          ./tests/packaging/verify-package.sh --package-dir artifacts/packages --aot

      # TreatWarningsAsErrors in the consumer turns any IL2xxx or IL3xxx warning into a failure. It
      # sends directly through Brevo and Resend, then through AddFreeTierMail().AddMailjet().
      - name: publish and run the AOT consumer
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)"
          dotnet publish tests/packaging/AotConsumer -c Release -r linux-x64 -p:FreeTierMailVersion="$version" -o aot/AotConsumer
          test "$(./aot/AotConsumer/AotConsumer)" = "Delivered"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg
          path: artifacts/packages/*.nupkg
          retention-days: 7

  codeql:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: csharp
      - run: dotnet build -c Release
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Blocks a merge that adds a dependency with a high or critical advisory. Needs the
      # repository Dependency graph enabled; without it the action errors with
      # "Dependency review is not supported on this repository".
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
