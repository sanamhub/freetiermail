name: release

# Builds, tests, packs and consumes the packages once, then publishes exactly those files after a
# manual approval. Adapted from sanamhub/ada-csharp, without the native build.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build, verify and attach artifacts without publishing to NuGet'
        type: boolean
        default: true

permissions:
  contents: read

# Two pushes of the same tag must never publish side by side.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  CI: 'true'

jobs:
  preflight:
    # Seconds, and it runs first, so a wrong tag fails before anything expensive or anything a
    # human has approved.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: the tag, the version and the changelog must agree
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          # Lockstep versioning: one <Version> for every package, in Directory.Build.props.
          project="$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)"
          if [ "$tag" != "$project" ]; then
            echo "::error::tag says $tag, Directory.Build.props says $project. Pushing this tag would publish the wrong version."
            exit 1
          fi
          ./scripts/changelog-section.sh "$tag" > /dev/null
          echo "tag, version and changelog agree: $tag"

  verify:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      - run: dotnet pack -c Release --no-build -o out
      - run: ./tests/packaging/verify-package.sh --package-dir out
      - name: consume under Native AOT
        run: |
          sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
          ./tests/packaging/verify-package.sh --package-dir out --aot

      # CycloneDX reads project.assets.json one project at a time, so each packable project gets
      # its own SBOM. Pinned, because a new major has changed the command line before.
      - name: sbom
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install -g CycloneDX --version 6.2.0
          mkdir -p sbom
          for proj in src/*/*.csproj; do
            name="$(basename "$proj" .csproj)"
            dotnet CycloneDX "$proj" -o sbom -fn "$name.bom.xml"
          done
          ls sbom

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: |
            out/*.nupkg
            out/*.snupkg
            sbom/*
          retention-days: 30

  publish:
    # Publishes the files verify produced, not a rebuild, so what was tested is what ships.
    needs: verify
    runs-on: windows-2025          # signtool, once a certificate exists
    environment: production        # manual approval gate
    permissions:
      contents: write              # create the GitHub release
      id-token: write              # NuGet trusted publishing, so there is no long lived key
      attestations: write          # provenance attestation on each nupkg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: files

      # Skipped rather than faked until a certificate exists. nuget.org repository-signs every
      # package regardless.
      - name: sign
        if: vars.CODE_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: scripts/sign.ps1 -Dir files/out

      # nuget.org checks a short lived GitHub OIDC token against the trusted publishing policy for
      # this repository, release.yml and the production environment, and returns an API key that
      # lives for one hour. So this sits immediately before the push.
      - name: exchange the OIDC token for a temporary api key
        id: nuget-login
        if: github.event_name == 'push' || inputs.dry-run == false
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: publish to nuget.org
        if: github.event_name == 'push' || inputs.dry-run == false
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'files/out'
          $packages = @(Get-ChildItem -Path $out -Filter '*.nupkg' -File)

          # The core goes first, so no other package is ever on nuget.org without the core
          # version it depends on.
          $core = @($packages | Where-Object { $_.Name -match '^FreeTierMail\.\d' })
          if ($core.Count -ne 1) { throw "expected exactly one FreeTierMail core package, found $($core.Count)" }
          $ordered = @($core) + @($packages | Where-Object { $_.Name -notmatch '^FreeTierMail\.\d' } | Sort-Object Name)

          foreach ($package in $ordered) {
              Write-Host "pushing $($package.Name)"
              # The matching .snupkg beside it goes up automatically as the symbols package.
              dotnet nuget push $package.FullName `
                  --api-key $env:NUGET_API_KEY `
                  --source https://api.nuget.org/v3/index.json `
                  --skip-duplicate
              if ($LASTEXITCODE -ne 0) { throw "dotnet nuget push failed for $($package.Name)" }
          }

      # Lets anyone check that a package was built by this workflow from this tag:
      # gh attestation verify <file>.nupkg --repo sanamhub/freetiermail
      - name: attest the packages
        if: github.event_name == 'push' || inputs.dry-run == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: files/out/*.nupkg

      # Notes come from CHANGELOG.md, not the commit log, so the release page and the changelog
      # cannot say different things.
      - name: build the release notes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          {
            ./scripts/changelog-section.sh "$version"
            echo
            echo "### Install"
            echo
            echo '```'
            echo "dotnet add package FreeTierMail --version $version"
            echo '```'
            echo
            echo "Published with NuGet trusted publishing. SBOMs attached."
            echo
            echo "[Full changelog](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)"
          } > release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: github.event_name == 'push'
        with:
          body_path: release-notes.md
          # Alpha, beta and rc tags land as prereleases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            files/out/*.nupkg
            files/out/*.snupkg
            files/sbom/*

  verify-published:
    # A release made with GITHUB_TOKEN does not trigger other workflows, so this is called from
    # here instead of listening for the release event.
    needs: publish
    if: github.event_name == 'push' || inputs.dry-run == false
    uses: ./.github/workflows/verify-published.yml
    with:
      version: ${{ github.event_name == 'push' && github.ref_name || '' }}
