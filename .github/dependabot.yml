version: 2
updates:
  # Grouped so related packages move in one PR instead of conflicting on Directory.Packages.props.
  # The cooldown gives a bad release a week to be pulled before it reaches this repository.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      microsoft-extensions:
        patterns: ["Microsoft.Extensions.*"]
      test:
        patterns: ["xunit.*", "Microsoft.Testing.*"]

  # The SDK version in global.json.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly

  # Keeps the SHA-pinned actions current. Dependabot updates a SHA pin when it carries a version
  # comment, which is why every pin has one.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      # init and analyze must share a version. Bumped apart, each PR fails the CodeQL job.
      codeql:
        patterns: ["github/codeql-action*"]
