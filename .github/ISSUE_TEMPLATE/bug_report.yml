name: Bug report
description: Something in FreeTierMail does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems go through [a private advisory](https://github.com/sanamhub/freetiermail/security/advisories/new), not here.
        Never paste an API key, a real recipient address, a subject or a message body.
  - type: textarea
    id: repro
    attributes:
      label: Code that reproduces it
      description: The smallest snippet that shows the problem, with keys and addresses replaced.
      render: csharp
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
      description: What you expected, what happened, the `SendResult` status, and the full exception if there was one.
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Brevo
        - Resend
        - Mailjet
        - Mailgun
        - SMTP2GO
        - MailerSend
        - Elastic Email
        - SMTP
        - Not provider specific
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FreeTierMail version
      placeholder: 0.1.0-alpha.1
    validations:
      required: true
  - type: input
    id: dotnet
    attributes:
      label: .NET version and OS
      description: Output of `dotnet --version`, plus the OS and architecture.
    validations:
      required: true
